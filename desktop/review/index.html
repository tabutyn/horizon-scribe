<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HorizonScribe · Next Round</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <div id="sheet" aria-label="Pre-rendered review sheet"></div>
      <nav aria-label="Pages">
        <button id="previous">← Previous</button><span id="page"></span
        ><button id="next">Next →</button
        ><label class="overlay-toggle" title="Toggle inferred-label overlay"
          ><input
            type="checkbox"
            id="overlay"
            checked
            aria-label="Show overlay"
          /><span aria-hidden="true"
            ><svg viewBox="0 0 24 24">
              <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
              <circle cx="12" cy="12" r="2.8" /></svg></span></label
        ><button id="selection-summary"><span id="count">0</span> selected</button>
      </nav>
    </main>
    <dialog id="selection-dialog">
      <div class="dialog-header">
        <h2>Selected images</h2>
        <form method="dialog"><button aria-label="Close selection">×</button></form>
      </div>
      <ol id="queue"></ol>
      <button id="download">Download selection JSON</button>
      <p class="meta">
        Selections save locally. Publishing to Cloudflare is a separate,
        explicit command.
      </p>
    </dialog>
    <p id="status" role="status" aria-live="polite"></p>
    <script type="module" src="/app.mjs"></script>
  </body>
</html>
